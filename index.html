<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veribase</title>

  <!-- PWA & Homescreen Settings (iOS & Android) -->
  <meta name="apple-mobile-web-app-title" content="Veribase">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --input-bg: #f1f5f9;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      margin: 0; padding: 20px;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .login-container { width: 100%; max-width: 400px; position: relative; }
    .theme-toggle-btn {
      position: absolute; top: -60px; right: 0;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .theme-toggle-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .title-group { text-align: center; margin-bottom: 24px; }
    
    /* Logo-Container mit Clipping für den Glow-Effekt */
    .logo-wrapper {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 0 auto 14px auto;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
    }

    .login-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: var(--card);
    }

    /* Der geschwungene Lichtstreifen (Ping-Pong-Effekt im Logo) */
    .logo-wrapper::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -150%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 35%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 65%
      );
      transform: rotate(25deg);
      pointer-events: none;
    }

    .logo-wrapper.glow-active::after {
      animation: logoShinePingPong 1.6s ease-in-out forwards;
    }

    @keyframes logoShinePingPong {
      0% { left: -150%; }
      50% { left: 100%; }
      100% { left: -150%; }
    }

    .title { font-size: 24px; font-weight: 700; margin: 0 0 6px 0; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin: 0; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: var(--text); font-size: 14px; margin-bottom: 16px; }
    button.submit-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; background: var(--primary); color: white; cursor: pointer; }
    button.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #ef4444; font-size: 13px; margin-top: 12px; text-align: center; font-weight: 500; min-height: 18px; }
  </style>
</head>
<body>

<div class="login-container">
  <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Design umschalten">
    <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <div class="card" id="loginCard">
    <div class="title-group">
      <div class="logo-wrapper" id="logoWrapper">
        <img src="logo.png" alt="Veribase Logo" class="login-logo">
      </div>
      <h1 class="title">Veribase</h1>
      <p class="subtitle">Anmeldung für Chefs & Fahrer</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <label for="username">Benutzername oder E-Mail</label>
      <input type="text" id="username" required placeholder="z. B. max_mustermann oder chef" autocomplete="username">
      
      <label for="password">Passwort</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      
      <button type="submit" id="submitBtn" class="submit-btn">Anmelden</button>
    </form>
    <div id="errorMsg" class="error"></div>
  </div>
</div>

<script>
  // Sofort beim Laden Dark Mode erzwingen, falls noch nicht gesetzt
  if (!localStorage.getItem('veribase_theme')) {
    localStorage.setItem('veribase_theme', 'dark');
  }
  const savedTheme = localStorage.getItem('veribase_theme');
  document.documentElement.setAttribute('data-theme', savedTheme);

  const SUPABASE_URL = 'https://cvfbkxzhpxopbkaymvvf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_EK07XF7umKLsdfbRK9p6gQ_0-5AkSjb';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.onload = async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user) {
      await redirectUser(session.user.id);
    }
  };

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('veribase_theme', next);
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    let identifier = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    errorMsg.innerText = 'Prüfe Zugangsdaten...';
    btn.disabled = true;

    if (!identifier.includes('@')) {
      identifier = `${identifier}@app.local`;
    }

    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ 
      email: identifier, 
      password 
    });

    if (authError) {
      errorMsg.innerText = 'Login fehlgeschlagen: Zugangsdaten ungültig.';
      btn.disabled = false;
      return;
    }

    // Logo-Glow-Effekt auslösen (Hin- und Her-Sweep)
    const logoWrapper = document.getElementById('logoWrapper');
    errorMsg.style.color = 'var(--primary)';
    errorMsg.innerText = 'Login erfolgreich!';
    logoWrapper.classList.add('glow-active');

    // 1,6 Sekunden warten, damit der Ping-Pong-Effekt komplett durchläuft
    setTimeout(async () => {
      await redirectUser(authData.user.id);
    }, 1600);
  }

  async function redirectUser(userId) {
    const errorMsg = document.getElementById('errorMsg');
    
    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', userId)
      .maybeSingle();

    if (profileError || !profile) {
      errorMsg.style.color = '#ef4444';
      errorMsg.innerText = 'Profil konnte nicht geladen werden.';
      document.getElementById('submitBtn').disabled = false;
      return;
    }

    if (profile.role === 'chef') {
      window.location.href = 'ChefDashboard.html';
    } else {
      window.location.href = 'TourApp.html';
    }
  }
</script>

</body>
</html>
