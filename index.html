<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veribase</title>

  <!-- PWA & Homescreen Settings (iOS & Android) -->
  <meta name="apple-mobile-web-app-title" content="Veribase">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- Sofortiges Laden des Dark Modes im Head -->
  <script>
    if (!localStorage.getItem('veribase_theme')) {
      localStorage.setItem('veribase_theme', 'dark');
    }
    document.documentElement.setAttribute('data-theme', localStorage.getItem('veribase_theme'));
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg: #e2e8f0;
      --text: #0f172a;
      --text-sub: #64748b;
      --text-muted: #94a3b8;
      --border: #cbd5e1;
      --accent-line: rgba(99, 102, 241, 0.4);
      --input-bg: #ffffff;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --surface-glass: rgba(255, 255, 255, 0.6);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    html[data-theme="dark"] {
      --bg: #030712;
      --text: #f9fafb;
      --text-sub: #9ca3af;
      --text-muted: #4b5563;
      --border: rgba(255, 255, 255, 0.08);
      --accent-line: rgba(99, 102, 241, 0.35);
      --input-bg: rgba(17, 24, 39, 0.6);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --surface-glass: rgba(17, 24, 39, 0.4);
      --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .theme-toggle-btn {
      position: absolute;
      top: -50px;
      right: 0;
      background: var(--surface-glass);
      border: 1px solid var(--accent-line);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }
    .theme-toggle-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* Clean Form ohne Kasten */
    .login-form-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .title-group {
      text-align: center;
      margin-bottom: 32px;
    }
    
    /* Logo-Wrapper ohne harten Kasten, edel schwebend */
    .logo-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 18px auto;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 30px var(--accent-glow);
      border: 1px solid var(--accent-line);
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
    }

    .login-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Der geschwungene Lichtstreifen (Ping-Pong-Effekt im Logo) */
    .logo-wrapper::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -150%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 35%,
        rgba(255, 255, 255, 0.65) 50%,
        transparent 65%
      );
      transform: rotate(25deg);
      pointer-events: none;
    }

    .logo-wrapper.glow-active::after {
      animation: logoShinePingPong 1.4s ease-in-out forwards !important;
    }

    @keyframes logoShinePingPong {
      0% { left: -150%; }
      50% { left: 100%; }
      100% { left: -150%; }
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 6px 0;
      letter-spacing: -0.03em;
    }
    
    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin: 0;
      font-weight: 500;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      margin-left: 2px;
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--accent-line);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button.submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    button.submit-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    button.submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      color: #ef4444;
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
      font-weight: 600;
      min-height: 20px;
    }
  </style>
</head>
<body>

<div class="login-container">
  <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Design umschalten">
    <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <div class="login-form-wrapper">
    <div class="title-group">
      <div class="logo-wrapper" id="logoWrapper">
        <img src="logo.png" alt="Veribase Logo" class="login-logo">
      </div>
      <h1 class="title">Veribase</h1>
      <p class="subtitle">Anmeldung für Chefs & Fahrer</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <label for="username">Benutzername oder E-Mail</label>
      <input type="text" id="username" required placeholder="z. B. max_mustermann oder chef" autocomplete="username">
      
      <label for="password">Passwort</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      
      <button type="submit" id="submitBtn" class="submit-btn">Anmelden</button>
    </form>
    <div id="errorMsg" class="error"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://cvfbkxzhpxopbkaymvvf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_EK07XF7umKLsdfbRK9p6gQ_0-5AkSjb';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.onload = async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user) {
      await redirectUser(session.user.id);
    }
  };

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('veribase_theme', next);
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const logoWrapper = document.getElementById('logoWrapper');
    
    let identifier = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    btn.disabled = true;

    // Animation SOFORT beim Klick starten
    logoWrapper.classList.add('glow-active');
    errorMsg.style.color = 'var(--accent)';
    errorMsg.innerText = 'Anmeldung läuft...';

    if (!identifier.includes('@')) {
      identifier = `${identifier}@app.local`;
    }

    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ 
      email: identifier, 
      password 
    });

    if (authError) {
      logoWrapper.classList.remove('glow-active');
      errorMsg.style.color = '#ef4444';
      errorMsg.innerText = 'Login fehlgeschlagen: Zugangsdaten ungültig.';
      btn.disabled = false;
      return;
    }

    errorMsg.innerText = 'Login erfolgreich!';

    setTimeout(async () => {
      await redirectUser(authData.user.id);
    }, 1200);
  }

  async function redirectUser(userId) {
    const errorMsg = document.getElementById('errorMsg');
    
    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', userId)
      .maybeSingle();

    if (profileError || !profile) {
      errorMsg.style.color = '#ef4444';
      errorMsg.innerText = 'Profil konnte nicht geladen werden.';
      document.getElementById('submitBtn').disabled = false;
      return;
    }

    if (profile.role === 'chef') {
      window.location.href = 'ChefDashboard.html';
    } else {
      window.location.href = 'TourApp.html';
    }
  }
</script>

</body>
</html>
