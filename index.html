<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veribase – Enterprise Cloud Auth</title>

  <meta name="apple-mobile-web-app-title" content="Veribase">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <script>
    if (!localStorage.getItem('veribase_theme')) {
      localStorage.setItem('veribase_theme', 'dark');
    }
    document.documentElement.setAttribute('data-theme', localStorage.getItem('veribase_theme'));
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --bg: #f8fafc;
      --card: rgba(255, 255, 255, 0.85);
      --text: #0f172a;
      --text-muted: #64748b;
      --border: rgba(226, 232, 240, 0.8);
      --input-bg: #f1f5f9;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    [data-theme="dark"] {
      --bg: #030712;
      --card: rgba(15, 23, 42, 0.75);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(51, 65, 85, 0.6);
      --input-bg: rgba(2, 6, 23, 0.6);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      margin: 0; padding: 20px;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .login-container { width: 100%; max-width: 420px; position: relative; }
    
    .theme-toggle-btn {
      position: absolute; top: -70px; right: 0;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer;
      backdrop-filter: blur(12px); box-shadow: var(--shadow); transition: all 0.25s ease;
    }
    .theme-toggle-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
    .theme-toggle-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    .title-group { text-align: center; margin-bottom: 28px; }
    
    .logo-wrapper {
      position: relative;
      width: 76px;
      height: 76px;
      margin: 0 auto 16px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px var(--primary-glow);
      border: 1px solid var(--border);
    }

    .login-logo {
      width: 100%; height: 100%; object-fit: contain; display: block; background: var(--card);
    }

    .logo-wrapper::after {
      content: '';
      position: absolute; top: -50%; left: -150%; width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent 35%, rgba(255, 255, 255, 0.7) 50%, transparent 65%);
      transform: rotate(25deg); pointer-events: none;
    }

    .logo-wrapper.glow-active::after {
      animation: logoShinePingPong 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    @keyframes logoShinePingPong {
      0% { left: -150%; }
      50% { left: 100%; }
      100% { left: -150%; }
    }

    .title { font-size: 24px; font-weight: 800; margin: 0 0 6px 0; letter-spacing: -0.03em; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin: 0; font-weight: 500; }
    
    label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    
    input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px; color: var(--text); font-family: inherit; font-size: 14px;
      margin-bottom: 20px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); background: var(--card); }

    button.submit-btn {
      width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; cursor: pointer;
      box-shadow: 0 8px 20px -4px var(--primary-glow); transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: -0.01em;
    }
    button.submit-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button.submit-btn:active { transform: scale(0.98); }
    button.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .error { color: #ef4444; font-size: 13px; margin-top: 16px; text-align: center; font-weight: 600; min-height: 20px; }
  </style>
</head>
<body>

<div class="login-container">
  <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Design umschalten">
    <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <div class="card" id="loginCard">
    <div class="title-group">
      <div class="logo-wrapper" id="logoWrapper">
        <img src="logo.png" alt="Veribase Logo" class="login-logo">
      </div>
      <h1 class="title">Veribase</h1>
      <p class="subtitle">Enterprise Cloud Management</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <label for="username">Benutzername oder E-Mail</label>
      <input type="text" id="username" required placeholder="z. B. max_mustermann oder chef" autocomplete="username">
      
      <label for="password">Passwort</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      
      <button type="submit" id="submitBtn" class="submit-btn">Anmelden</button>
    </form>
    <div id="errorMsg" class="error"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://cvfbkxzhpxopbkaymvvf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_EK07XF7umKLsdfbRK9p6gQ_0-5AkSjb';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.onload = async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user) {
      await redirectUser(session.user.id);
    }
  };

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('veribase_theme', next);
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const logoWrapper = document.getElementById('logoWrapper');
    
    let identifier = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    logoWrapper.classList.add('glow-active');
    errorMsg.style.color = 'var(--primary)';
    errorMsg.innerText = 'Authentifiziere...';

    if (!identifier.includes('@')) {
      identifier = `${identifier}@app.local`;
    }

    const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ 
      email: identifier, 
      password 
    });

    if (authError) {
      logoWrapper.classList.remove('glow-active');
      errorMsg.style.color = '#ef4444';
      errorMsg.innerText = 'Login fehlgeschlagen: Zugangsdaten ungültig.';
      btn.disabled = false;
      return;
    }

    errorMsg.innerText = 'Erfolgreich angemeldet!';

    setTimeout(async () => {
      await redirectUser(authData.user.id);
    }, 1200);
  }

  async function redirectUser(userId) {
    const errorMsg = document.getElementById('errorMsg');
    
    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', userId)
      .maybeSingle();

    if (profileError || !profile) {
      errorMsg.style.color = '#ef4444';
      errorMsg.innerText = 'Profil konnte nicht geladen werden.';
      document.getElementById('submitBtn').disabled = false;
      return;
    }

    if (profile.role === 'chef') {
      window.location.href = 'ChefDashboard.html';
    } else {
      window.location.href = 'TourApp.html';
    }
  }
</script>
</body>
</html>
